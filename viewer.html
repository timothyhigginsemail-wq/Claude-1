<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efede7; --text:#1d2126; --muted:#6a6f77; --faint:#9a9ea5;
  --border:#e2dfd8; --accent:#3b5bdb; --accent-soft:rgba(59,91,219,.12);
  --edge:rgba(40,44,52,.16); --edge-hl:rgba(40,44,52,.6); --ghost:#a3a7ad; --orphan:#d6453d;
  --shadow:0 10px 30px rgba(30,30,40,.10), 0 2px 6px rgba(30,30,40,.06);
  --seed:#c08a1e; --budding:#4d9a4f; --evergreen:#1f7a5a;
  --ui:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --read:'Literata', 'Iowan Old Style', Charter, Georgia, serif;
  --mono:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --panel-w:min(480px, 44vw);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131518; --surface:#1b1e22; --surface-2:#24282d; --text:#e5e4df; --muted:#9a9ea6; --faint:#6e737b;
    --border:#2d3137; --accent:#8ea2ff; --accent-soft:rgba(142,162,255,.14);
    --edge:rgba(225,225,235,.13); --edge-hl:rgba(235,235,245,.6); --ghost:#6c7178; --orphan:#ff6b61;
    --shadow:0 10px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    --seed:#e2b04a; --budding:#7cc47e; --evergreen:#4fc79a;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--ui);display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;white-space:nowrap}
.brand svg{width:22px;height:22px;color:var(--accent)}
.search{position:relative;flex:1 1 260px;max-width:520px}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);padding:0 34px 0 34px;outline:none;transition:border-color .15s, background .15s}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search .ico{position:absolute;left:10px;top:9px;width:18px;height:18px;color:var(--faint);pointer-events:none}
.search input:not(:placeholder-shown) ~ kbd{display:none}
.search kbd{position:absolute;right:8px;top:8px;font:11px var(--mono);color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
.results{position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:min(60vh,460px);overflow:auto;padding:6px}
.res{display:flex;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;align-items:flex-start}
.res:hover,.res.active{background:var(--accent-soft)}
.res .rt{font-weight:500}
.res .rs{color:var(--muted);font-size:12.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:rgba(255,200,0,.35);color:inherit;border-radius:2px;padding:0 1px}
.res-empty{padding:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c, var(--ghost));flex:none;margin-top:5px}
.dot.ghost{background:transparent;border:1.5px dashed var(--ghost)}
.filters{display:flex;gap:6px}
.filters select{height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);padding:0 8px;max-width:150px}
.btn{height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);padding:0 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){ .btn.primary{color:#111} }

.subbar{display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);min-height:40px;flex-wrap:wrap}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
.stats{display:flex;gap:14px;color:var(--muted);font-size:12.5px;margin-left:auto;flex-wrap:wrap}
.stats b{color:var(--text);font-weight:600}
.stats .s-orph b{color:var(--orphan)}
.source{color:var(--faint);font-size:12px}

/* ---------- main + views ---------- */
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto}
.view.list{padding:24px clamp(16px,4vw,40px) 80px;transition:padding-right .25s}
main.panel-open .view.list{padding-right:calc(var(--panel-w) + 24px)}
#graph{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:radial-gradient(circle at 50% 40%, var(--surface) 0%, var(--bg) 70%)}
#graph:active{cursor:grabbing}
.link{stroke:var(--edge);stroke-width:1.1;transition:stroke .15s, opacity .15s}
.link.ghost{stroke-dasharray:3 3}
.link.hl{stroke:var(--edge-hl);stroke-width:1.6}
.link.dim{opacity:.25}
.node{cursor:pointer;transition:opacity .15s}
.node .dot-c{fill:var(--c);stroke:var(--surface);stroke-width:1.5}
.node.s-seed .dot-c{fill-opacity:.28;stroke:var(--c);stroke-dasharray:3 2;stroke-width:1.6}
.node.s-evergreen .dot-c{filter:url(#glow);stroke:var(--c);stroke-width:2;stroke-opacity:.5}
.node.ghost .dot-c{fill:var(--bg);stroke:var(--ghost);stroke-dasharray:2 2;stroke-width:1.4}
.node .ring{fill:none;stroke:none}
.node.orphan .ring{stroke:var(--orphan);stroke-width:1.5;stroke-dasharray:1.5 3}
.node.index .dot-c{stroke:var(--c);stroke-width:3;stroke-opacity:.35}
.node.selected .ring{stroke:var(--accent);stroke-width:2.5;stroke-dasharray:none}
.node text{font:500 11px var(--ui);fill:var(--muted);text-anchor:middle;pointer-events:none;opacity:0;transition:opacity .15s;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.node.ghost text{font-style:italic}
.node.show-label text{opacity:1}
.node.focus text,.node.selected text{fill:var(--text);font-weight:600}
.node.dim{opacity:.18}
.node.dim text{opacity:0}

.graph-controls{position:absolute;top:12px;left:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:2px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;color:var(--muted);font-size:13px}
.seg button.active{background:var(--accent-soft);color:var(--text);font-weight:500}
.chip-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:5px 10px;font-size:13px;color:var(--muted);box-shadow:var(--shadow);cursor:pointer}
.graph-controls .btn{height:31px;box-shadow:var(--shadow)}
.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);font-size:12.5px;max-width:260px;z-index:5}
.legend summary{padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;list-style:none}
.legend summary::-webkit-details-marker{display:none}
.legend .lg-body{padding:0 12px 10px}
.legend .lg-row{display:flex;align-items:center;gap:8px;padding:3px 4px;border-radius:6px;cursor:pointer}
.legend .lg-row:hover{background:var(--surface-2)}
.legend .lg-row.off{opacity:.4}
.legend .lg-row .n{margin-left:auto;color:var(--faint)}
.legend hr{border:0;border-top:1px solid var(--border);margin:6px 0}
.legend svg{flex:none}
.graph-hint{position:absolute;top:56px;left:12px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 10px;color:var(--muted);font-size:12.5px;box-shadow:var(--shadow)}
.lib-error{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}

/* ---------- side panel / bottom sheet ---------- */
.panel{position:absolute;top:0;right:0;bottom:0;width:var(--panel-w);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .25s ease, height .25s ease;display:flex;flex-direction:column;z-index:20}
.panel.open{transform:none}
.panel-head{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border)}
.panel-head .sp{flex:1}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:disabled{opacity:.3;cursor:default;background:none}
.icon-btn svg{width:18px;height:18px}
.panel-head .btn{height:30px;font-size:12.5px}
.sheet-grip{display:none;padding:8px 0 2px;touch-action:none}
.sheet-grip span{display:block;width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto}
.panel-body{overflow:auto;padding:20px 26px 60px;flex:1;overscroll-behavior:contain}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:0}
.chip.topic{background:color-mix(in srgb, var(--c) 14%, transparent);color:var(--text)}
.chip.topic::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.st-seed{color:var(--seed)} .chip.st-budding{color:var(--budding)} .chip.st-evergreen{color:var(--evergreen)}
.chip.ghost-chip{border:1px dashed var(--ghost);background:none}
.chip.orph{color:var(--orphan)}
button.chip{cursor:pointer}
button.chip:hover{color:var(--text)}
.note-title{font:600 clamp(24px,3vw,30px)/1.2 var(--read);margin:4px 0 8px;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.tags .chip::before{content:'#';opacity:.6;margin-right:-4px}
.prose{font-family:var(--read);font-size:17px;line-height:1.68;margin-top:18px;overflow-wrap:break-word}
.prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--read);line-height:1.3;margin:1.5em 0 .5em}
.prose h1{font-size:1.5em} .prose h2{font-size:1.25em} .prose h3{font-size:1.08em}
.prose p,.prose ul,.prose ol,.prose blockquote,.prose table,.prose pre{margin:0 0 1em}
.prose ul,.prose ol{padding-left:1.4em}
.prose li{margin:.2em 0}
.prose blockquote{border-left:3px solid var(--accent);padding:.2em 0 .2em 1em;color:var(--muted);font-style:italic}
.prose code{font:.85em var(--mono);background:var(--surface-2);padding:.15em .4em;border-radius:5px}
.prose pre{background:var(--surface-2);padding:12px 14px;border-radius:10px;overflow:auto;line-height:1.5}
.prose pre code{background:none;padding:0}
.prose table{border-collapse:collapse;font-family:var(--ui);font-size:14px;display:block;overflow:auto}
.prose th,.prose td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.prose th{background:var(--surface-2)}
.prose img{max-width:100%;border-radius:8px}
.prose hr{border:0;border-top:1px solid var(--border);margin:2em 0}
a.wikilink{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--accent) 35%, transparent);cursor:pointer}
a.wikilink:hover{border-bottom-color:var(--accent)}
a.wikilink.ghost{color:var(--muted);border-bottom:1px dashed var(--ghost)}
.links-sec{margin-top:28px;border-top:1px solid var(--border);padding-top:16px}
.links-sec h3{font:600 12px var(--ui);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.bl{display:block;width:100%;text-align:left;background:var(--surface-2);border:0;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.bl:hover{background:var(--accent-soft)}
.bl .t{display:flex;align-items:center;gap:8px;font-weight:500}
.bl .t .dot{margin-top:0}
.bl .s{color:var(--muted);font-size:12.5px;margin-top:4px;font-family:var(--read)}
.bl .s b{color:var(--text);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.muted{color:var(--muted)}

/* ---------- list views ---------- */
.view h2.vh{font:600 22px var(--read);margin:0 0 4px}
.view p.vsub{color:var(--muted);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s, box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.card h3{margin:4px 0 0;font:600 18px var(--read)}
.card .desc{color:var(--muted);font-size:13.5px;flex:1}
.card .count{font-size:28px;font-weight:600;line-height:1;color:var(--c)}
.card .count small{font-size:13px;color:var(--muted);font-weight:400}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .acts{display:flex;gap:6px}
.rows{display:flex;flex-direction:column;gap:2px;max-width:900px}
.nrow{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.nrow:hover{background:var(--surface)}
.nrow .d{color:var(--faint);font:12px var(--mono)}
.nrow .tt{font-weight:500;display:flex;align-items:center;gap:8px}
.nrow .tt .dot{margin-top:0}
.nrow .sn{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nrow .r{display:flex;gap:6px}
.month{font:600 12px var(--ui);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 12px 6px}
.garden{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gcol{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.gcol h3{margin:0 0 4px;font:600 16px var(--read);display:flex;align-items:center;gap:8px}
.gcol h3 .n{margin-left:auto;font:600 13px var(--ui);color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 9px}
.gcol p{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.gitem{display:block;width:100%;text-align:left;border:0;background:var(--surface-2);border-radius:10px;padding:9px 11px;margin-bottom:6px}
.gitem:hover{background:var(--accent-soft)}
.gitem .t{font-weight:500;display:flex;gap:8px;align-items:center}
.gitem .t .dot{margin-top:0}
.gitem .s{color:var(--muted);font-size:12px;margin-top:3px}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--border);border-radius:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:100;font-size:13px}

/* ---------- phone ---------- */
@media (max-width: 760px){
  .topbar{gap:8px;padding:8px 12px}
  .brand span{display:none}
  .search{flex:1 1 0;max-width:none;min-width:0}
  .search input{height:34px}
  .search kbd{display:none}
  .filters{order:4;flex-basis:100%;overflow-x:auto;scrollbar-width:none}
  .filters select{flex:1;min-width:0;max-width:none}
  .topbar .btn.of span{display:none}
  .topbar .sp{display:none}
  .subbar{padding:0 8px;gap:8px}
  .tabs{overflow-x:auto;scrollbar-width:none}
  .stats{display:none}
  .stats.mobile{display:flex;margin:0;gap:10px;font-size:12px}
  .source{display:none}
  .panel{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;height:55dvh;border-left:0;border-top:1px solid var(--border);border-radius:18px 18px 0 0;transform:translateY(102%)}
  .panel.expanded{height:92dvh}
  .sheet-grip{display:block}
  .panel-body{padding:14px 18px 60px}
  .prose{font-size:16.5px}
  main.panel-open .view.list{padding-right:clamp(16px,4vw,40px)}
  .legend{max-width:calc(100% - 24px)}
  .nrow{grid-template-columns:1fr;gap:4px}
  .nrow .r{display:none}
  .graph-controls{right:12px}
}
@media (min-width: 761px){ .stats.mobile{display:none} .topbar .sp{display:none} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="7" r="2.6"/><circle cx="18" cy="6" r="2"/><circle cx="16" cy="17" r="3"/><circle cx="6" cy="17" r="1.8"/><path d="M8.4 7.6 16 6.5M7.7 8.9l6.6 6.3M7.8 17h5.2M17.5 8l-.9 6"/></svg><span>Knowledge Base</span></div>
  <div class="sp"></div>
  <div class="search">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search titles and content" autocomplete="off" spellcheck="false" aria-label="Search notes">
    <kbd>/</kbd>
    <div id="results" class="results" role="listbox" hidden></div>
  </div>
  <div class="filters">
    <select id="f-topic" aria-label="Filter by topic"></select>
    <select id="f-tag" aria-label="Filter by tag"></select>
    <select id="f-status" aria-label="Filter by status"></select>
  </div>
  <button id="open-folder" class="btn of" title="Load a notes folder from disk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Open folder</span></button>
  <input id="folder-input" type="file" webkitdirectory directory multiple hidden>
</header>
<div class="subbar">
  <nav class="tabs" role="tablist">
    <button data-view="graph" class="active" role="tab">Graph</button>
    <button data-view="topics" role="tab">Topics</button>
    <button data-view="recent" role="tab">Recent</button>
    <button data-view="garden" role="tab">Garden</button>
  </nav>
  <div class="stats mobile" id="stats-m"></div>
  <div class="stats" id="stats"></div>
  <span class="source" id="source"></span>
</div>
<main id="main">
  <section id="view-graph" class="view">
    <svg id="graph" aria-label="Note graph"></svg>
    <div class="graph-controls">
      <div class="seg" id="mode-seg"><button data-mode="full" class="active">Full graph</button><button data-mode="local">Local</button></div>
      <div class="seg" id="hops-seg" hidden><button data-hops="1" class="active">1 hop</button><button data-hops="2">2 hops</button></div>
      <label class="chip-toggle"><input type="checkbox" id="show-ghosts" checked> Ghosts</label>
      <button class="btn" id="fit" title="Fit graph to screen">Fit</button>
    </div>
    <div class="graph-hint" id="graph-hint" hidden></div>
    <details class="legend" id="legend"><summary>Legend</summary><div class="lg-body" id="legend-body"></div></details>
  </section>
  <section id="view-topics" class="view list" hidden></section>
  <section id="view-recent" class="view list" hidden></section>
  <section id="view-garden" class="view list" hidden></section>
  <aside id="panel" class="panel" aria-hidden="true">
    <div class="sheet-grip" id="grip"><span></span></div>

<script id="kb-data" type="application/json">{"generatedAt":"2026-11-03T02:53:53.995Z","source":"notes/","origin":"build","notes":[{"id":"options/_index","path":"options/_index.md","folder":"options","base":"_index","title":"Options","isIndex":true,"topic":"options","tags":["sample","moc"],"aliases":[],"type":"index","status":"evergreen","description":"","created":"2026-09-01","updated":"2026-10-29","words":47,"body":"# Options\n\nPricing, risk, and the volatility surface — notes behind the Convexity desk game.\n\n- [[Black-Scholes]] — the reference model\n- [[Implied volatility]] — the market's price, quoted in vol\n- [[The Greeks]] — sensitivities you hedge\n- [[Volatility smile]] — where Black-Scholes breaks\n- [[Gamma scalping]] — trading realised vs implied\n","out":["options/black-scholes","options/implied-volatility","options/the-greeks","options/volatility-smile","options/gamma-scalping"],"in":[],"ghostOut":[],"degree":5,"orphan":false},{"id":"options/black-scholes","path":"options/black-scholes.md","folder":"options","base":"black-scholes","title":"Black-Scholes","isIndex":false,"topic":"options","tags":["sample","pricing","models"],"aliases":["BS","Black-Scholes-Merton"],"type":"concept","status":"evergreen","description":"","created":"2026-09-01","updated":"2026-10-02","words":88,"body":"# Black-Scholes\n\nPrices a European option assuming the underlying follows geometric Brownian motion with constant volatility σ.\n\nFor a call: **C = S·N(d₁) − K·e^(−rT)·N(d₂)**\n\nThe key insight is **replication**: a continuously rebalanced delta hedge removes all risk, so the option price can't depend on expected return — only on volatility.\n\nThe model's one unobservable input is σ, so the market quotes options in [[Implied volatility]]. Its sensitivities are [[The Greeks]]. Real markets violate the constant-σ assumption → [[Volatility smile]], and models like [[Heston model]] try to fix that.\n","out":["options/implied-volatility","options/the-greeks","options/volatility-smile"],"in":["options/_index","options/implied-volatility"],"ghostOut":["ghost:heston-model"],"degree":5,"orphan":false},{"id":"options/gamma-scalping","path":"options/gamma-scalping.md","folder":"options","base":"gamma-scalping","title":"Gamma scalping","isIndex":false,"topic":"options","tags":["sample","strategies","volatility"],"aliases":[],"type":"strategy","status":"budding","description":"","created":"2026-09-20","updated":"2026-10-31","words":51,"body":"# Gamma scalping\n\nBuy an option, delta-hedge it repeatedly. Each re-hedge sells high and buys low, harvesting **realised** volatility; you pay [[Implied volatility]] via theta.\n\nP&L ≈ ½ Γ S² (σ²_realised − σ²_implied) dt\n\nSee [[The Greeks]] for the gamma/theta trade-off. Hedging costs — the [[Bid-ask spread]] — eat into the edge.\n","out":["options/implied-volatility","options/the-greeks","trading-desk/bid-ask-spread"],"in":["options/_index","options/implied-volatility","options/the-greeks"],"ghostOut":[],"degree":4,"orphan":false},{"id":"options/implied-volatility","path":"options/implied-volatility.md","folder":"options","base":"implied-volatility","title":"Implied volatility","isIndex":false,"topic":"options","tags":["sample","pricing","volatility"],"aliases":[],"type":"concept","status":"evergreen","description":"","created":"2026-09-05","updated":"2026-10-27","words":63,"body":"# Implied volatility\n\nThe σ that makes [[Black-Scholes]] match the market price. It's a *quoting convention*: traders say \"the 3-month 25-delta put is at 22 vol\" rather than quoting dollars.\n\nPlotting IV across strikes gives the [[Volatility smile]]; across strikes *and* expiries, the vol surface.\n\nIf realised vol ends up above implied, a delta-hedged long option makes money — the basis of [[Gamma scalping]].\n","out":["options/black-scholes","options/volatility-smile","options/gamma-scalping"],"in":["options/_index","options/black-scholes","options/gamma-scalping","options/the-greeks","options/volatility-smile"],"ghostOut":[],"degree":5,"orphan":false},{"id":"options/the-greeks","path":"options/the-greeks.md","folder":"options","base":"the-greeks","title":"The Greeks","isIndex":false,"topic":"options","tags":["sample","risk"],"aliases":[],"type":"reference","status":"budding","description":"","created":"2026-09-08","updated":"2026-10-18","words":59,"body":"# The Greeks\n\n| Greek | Sensitivity to | Intuition |\n|---|---|---|\n| Delta Δ | spot | hedge ratio |\n| Gamma Γ | spot (2nd order) | how fast delta changes |\n| Vega ν | [[Implied volatility]] | vol exposure |\n| Theta Θ | time | the rent you pay for gamma |\n\nLong gamma ⇔ short theta. This trade-off is the whole of [[Gamma scalping]].\n\nOn the desk, Greeks aggregate into the book's [[Inventory risk]].\n","out":["options/implied-volatility","options/gamma-scalping","trading-desk/inventory-risk"],"in":["options/_index","options/black-scholes","options/gamma-scalping","trading-desk/inventory-risk"],"ghostOut":[],"degree":5,"orphan":false},{"id":"options/volatility-smile","path":"options/volatility-smile.md","folder":"options","base":"volatility-smile","title":"Volatility smile","isIndex":false,"topic":"options","tags":["sample","volatility"],"aliases":[],"type":"concept","status":"seed","description":"","created":"2026-10-22","updated":"2026-10-22","words":35,"body":"# Volatility smile\n\n[[Implied volatility]] is not flat across strikes. Equity indices show a *skew* (OTM puts expensive); FX often a symmetric smile.\n\nIdeas to develop: crash-o-phobia since 1987, sticky-strike vs sticky-delta, [[Heston model]], [[SABR model]].\n","out":["options/implied-volatility"],"in":["options/_index","options/black-scholes","options/implied-volatility"],"ghostOut":["ghost:heston-model","ghost:sabr-model"],"degree":5,"orphan":false},{"id":"philosophy/_index","path":"philosophy/_index.md","folder":"philosophy","base":"_index","title":"Philosophy","isIndex":true,"topic":"philosophy","tags":["philosophy","framework","moc"],"aliases":[],"type":"index","status":"budding","description":"","created":"2026-11-03","updated":"2026-11-03","words":112,"body":"# Philosophy\n\nA nine-step framework from minimal certainty to practical principles for living well.\n\n## Stages\n- **1–6 Establishing understanding** — what exists, how we experience it, how we form reliable beliefs.\n- **7–8 Understanding ourselves** — what we appear to be and why we have the desires we have.\n- **9 Deciding how to live** — which goals are worth pursuing and how to act.\n\n## Steps\n1. [[Existence and uncertainty]]\n2. [[Distinction]]\n3. [[Structure and regularity]]\n4. [[Conditions of comprehension]]\n5. [[Prediction and reliability]]\n6. [[Justified belief and action]]\n7. [[Human existence]]\n8. [[Evolution and motivation]]\n9. [[Practical philosophy]]\n\n## Open questions\n- [[Other minds]] — where does \"we\" get earned?\n- [[Problem of induction]]\n- [[Source of normativity]] — the standard for evaluating values\n- [[Ethics and other people]]\n","out":["philosophy/01-existence-and-uncertainty","philosophy/02-distinction","philosophy/03-structure-and-regularity","philosophy/04-conditions-of-comprehension","philosophy/05-prediction-and-reliability","philosophy/06-justified-belief-and-action","philosophy/07-human-existence","philosophy/08-evolution-and-motivation","philosophy/09-practical-philosophy"],"in":["philosophy/01-existence-and-uncertainty","philosophy/09-practical-philosophy"],"ghostOut":["ghost:other-minds","ghost:problem-of-induction","ghost:source-of-normativity","ghost:ethics-and-other-people"],"degree":13,"orphan":false},{"id":"philosophy/01-existence-and-uncertainty","path":"philosophy/01-existence-and-uncertainty.md","folder":"philosophy","base":"01-existence-and-uncertainty","title":"Existence and uncertainty","isIndex":false,"topic":"philosophy","tags":["philosophy","framework","establishing-understanding"],"aliases":[],"type":"premise","status":"evergreen","description":"","created":"2026-11-03","updated":"2026-11-03","words":55,"body":"# Existence and uncertainty\n\n**Step 1 of 9 · Establishing understanding**\n\n> Something exists—at minimum, experience is occurring—but we cannot conclusively establish its ultimate nature.\n\nThe minimal starting point. Note that this establishes *experience*, not yet a \"we\": the existence of a subject and of [[Other minds]] has to be earned later.\n\n← [[Philosophy]] · [[Distinction]] →\n","out":["philosophy/_index","philosophy/02-distinction"],"in":["philosophy/_index","philosophy/02-distinction"],"ghostOut":["ghost:other-minds"],"degree":3,"orphan":false},{"id":"philosophy/02-distinction","path":"philosophy/02-distinction.md","folder":"philosophy","base":"02-distinction","title":"Distinction","isIndex":false,"topic":"philosophy","tags":["philosophy","framework","establishing-understanding"],"aliases":[],"type":"premise","status":"evergreen","description":"","created":"2026-11-03","updated":"2026-11-03","words":45,"body":"# Distinction\n\n**Step 2 of 9 · Establishing understanding**\n\n> Experience contains distinguishable content, regardless of its underlying source.\n\nNeutral about what causes the content (world, dream, simulation) — it only claims that there are differences within experience.\n\n← [[Existence and uncertainty]] · [[Structure and regularity]] →\n","out":["philosophy/01-existence-and-uncertainty","philosophy/03-structure-and-regularity"],"in":["philosophy/_index","philosophy/01-existence-and-uncertainty","philosophy/03-structure-and-regularity"],"ghostOut":[],"degree":3,"orphan":false},{"id":"philosophy/03-structure-and-regularity","path":"philosophy/03-structure-and-regularity.md","folder":"philosophy","base":"03-structure-and-regularity","title":"Structure and regularity","isIndex":false,"topic":"philosophy","tags":["philosophy","framework","establishing-understanding"],"aliases":[],"type":"premise","status":"evergreen","description":"","created":"2026-11-03","updated":"2026-11-03","words":44,"body":"# Structure and regularity\n\n**Step 3 of 9 · Establishing understanding**\n\n> Experience exhibits patterns, relationships, and apparent laws, although their ultimate origin remains uncertain.\n\nPatterns are observed, not explained. This sets up the move from description to modelling.\n\n← [[Distinction]] · [[Conditions of comprehension]] →\n","out":["philosophy/02-distinction","philosophy/04-conditions-of-comprehension"],"in":["philosophy/_index","philosophy/02-distinction","philosophy/04-conditions-of-comprehension"],"ghostOut":[],"degree":3,"orphan":false},{"id":"philosophy/04-conditions-of-comprehension","path":"philosophy/04-conditions-of-comprehension.md","folder":"philosophy","base":"04-conditions-of-comprehension","title":"Conditions of comprehension","isIndex":false,"topic":"philosophy","tags":["philosophy","framework","establishing-understanding"],"aliases":[],"type":"premise","status":"budding","description":"","created":"2026-11-03","updated":"2026-11-03","words":62,"body":"# Conditions of comprehension\n\n**Step 4 of 9 · Establishing understanding**\n\n> Understanding experience requires logical and cognitive structures, without necessarily establishing that these structures characterize ultimate reality.\n\nOpen question: steps 1–3 already use logic, so this is better read as a precondition accepted from the start than as a conclusion. See [[Presuppositions of reasoning]].\n\n← [[Structure and regularity]] · [[Prediction and reliability]] →\n","out":["philosophy/03-structure-and-regularity","philosophy/05-prediction-and-reliability"],"in":["philosophy/_index","philosophy/03-structure-and-regularity","philosophy/05-prediction-and-reliability"],"ghostOut":["ghost:presuppositions-of-reasoning"],"degree":4,"orphan":false},{"id":"philosophy/05-prediction-and-reliability","path":"philosophy/05-prediction-and-reliability.md","folder":"philosophy","base":"05-prediction-and-reliability","title":"Prediction and reliability","isIndex":false,"topic":"philosophy","tags":["philosophy","framework","establishing-understanding"],"aliases":[],"type":"premise","status":"budding","description":"","created":"2026-11-03","updated":"2026-11-03","words":74,"body":"# Prediction and reliability\n\n**Step 5 of 9 · Establishing understanding**\n\n> Observed regularities allow us to construct models whose reliability can be evaluated through their predictive success, although past success cannot guarantee future results.\n\nOpen question: judging reliability by past success is itself induction — the [[Problem of induction]]. A possible answer is the [[Pragmatic vindication of induction]]: if any method works, this one will.\n\n← [[Conditions of comprehension]] · [[Justified belief and action]] →\n","out":["philosophy/04-conditions-of-comprehension","philosophy/06-justified-belief-and-action"],"in":["philosophy/_index","philosophy/04-conditions-of-comprehension","philosophy/06-justified-belief-and-action"],"ghostOut":["ghost:problem-of-induction","ghost:pragmatic-vindication-of-induction"],"degree":5,"orphan":false},{"id":"philosophy/06-justified-belief-and-action","path":"philosophy/06-justified-belief-and-action.md","folder":"philosophy","base":"06-justified-belief-and-action","title":"Justified belief and action","isIndex":false,"topic":"philosophy","tags":["philosophy","framework","establishing-understanding"],"aliases":[],"type":"premise","status":"evergreen","description":"","created":"2026-11-03","updated":"2026-11-03","words":49,"body":"# Justified belief and action\n\n**Step 6 of 9 · Establishing understanding**\n\n> The demonstrated reliability of our methods provides a basis for rationally justified beliefs that can guide action, without requiring absolute certainty.\n\nFallibilism: justification without certainty. This closes the first stage.\n\n← [[Prediction and reliability]] · [[Human existence]] →\n","out":["philosophy/05-prediction-and-reliability","philosophy/07-human-existence"],"in":["philosophy/_index","philosophy/05-prediction-and-reliability","philosophy/07-human-existence"],"ghostOut":[],"degree":3,"orphan":false},{"id":"philosophy/07-human-existence","path":"philosophy/07-human-existence.md","folder":"philosophy","base":"07-human-existence","title":"Human existence","isIndex":false,"topic":"philosophy","tags":["philosophy","framework","understanding-ourselves"],"aliases":[],"type":"premise","status":"evergreen","description":"","created":"2026-11-03","updated":"2026-11-03","words":60,"body":"# Human existence\n\n**Step 7 of 9 · Understanding ourselves**\n\n> The available evidence strongly indicates that we are biological human beings shaped by evolution.\n\nBest read as the *output* of applying steps 5–6, not a new axiom: \"Applying these methods, the best-supported account is that we are…\". Implicitly includes [[Other minds]].\n\n← [[Justified belief and action]] · [[Evolution and motivation]] →\n","out":["philosophy/06-justified-belief-and-action","philosophy/08-evolution-and-motivation"],"in":["philosophy/_index","philosophy/06-justified-belief-and-action","philosophy/08-evolution-and-motivation"],"ghostOut":["ghost:other-minds"],"degree":4,"orphan":false},{"id":"philosophy/08-evolution-and-motivation","path":"philosophy/08-evolution-and-motivation.md","folder":"philosophy","base":"08-evolution-and-motivation","title":"Evolution and motivation","isIndex":false,"topic":"philosophy","tags":["philosophy","framework","understanding-ourselves"],"aliases":[],"type":"premise","status":"evergreen","description":"","created":"2026-11-03","updated":"2026-11-03","words":57,"body":"# Evolution and motivation\n\n**Step 8 of 9 · Understanding ourselves**\n\n> Evolution shaped our drives toward survival, reproduction, pleasure, attachment, belonging, status, autonomy, and exploration, but their evolutionary origins do not establish which goals we should pursue.\n\nExplicitly respects the [[Is-ought gap]]: explaining where a desire comes from doesn't justify it.\n\n← [[Human existence]] · [[Practical philosophy]] →\n","out":["philosophy/07-human-existence","philosophy/09-practical-philosophy"],"in":["philosophy/_index","philosophy/07-human-existence","philosophy/09-practical-philosophy"],"ghostOut":["ghost:is-ought-gap"],"degree":4,"orphan":false},{"id":"philosophy/09-practical-philosophy","path":"philosophy/09-practical-philosophy.md","folder":"philosophy","base":"09-practical-philosophy","title":"Practical philosophy","isIndex":false,"topic":"philosophy","tags":["philosophy","framework","deciding-how-to-live"],"aliases":[],"type":"premise","status":"budding","description":"","created":"2026-11-03","updated":"2026-11-03","words":86,"body":"# Practical philosophy\n\n**Step 9 of 9 · Deciding how to live**\n\n> By understanding our nature, evaluating what we value, and applying reliable knowledge, we can develop rational principles for living well.\n\nMain open question: by what standard are values evaluated? See [[Source of normativity]] (Humean, reflective endorsement, or experience-based value). Also unaddressed: why other people's interests count — [[Ethics and other people]].\n\nPossible split: 9 how values are assessed · 10 other people's interests · 11 acting under uncertainty.\n\n← [[Evolution and motivation]] · [[Philosophy]] →\n","out":["philosophy/08-evolution-and-motivation","philosophy/_index"],"in":["philosophy/_index","philosophy/08-evolution-and-motivation"],"ghostOut":["ghost:source-of-normativity","ghost:ethics-and-other-people"],"degree":4,"orphan":false},{"id":"research-methods/_index","path":"research-methods/_index.md","folder":"research-methods","base":"_index","title":"Research Methods","isIndex":true,"topic":"research-methods","tags":["sample","moc"],"aliases":[],"type":"index","status":"evergreen","description":"","created":"2026-09-02","updated":"2026-10-28","words":64,"body":"# Research Methods\n\nHow to test a trading idea honestly — the statistics and pitfalls behind every backtest in this repo.\n\n- [[Information coefficient]] — how strongly a signal ranks future returns\n- [[Look-ahead bias]] — the most common way a backtest lies\n- [[Newey-West standard errors]] — t-stats for overlapping returns\n- [[Multiple testing]] — why trying 50 signals guarantees one \"works\"\n- [[Walk-forward validation]] — out-of-sample, done properly\n","out":["research-methods/information-coefficient","research-methods/look-ahead-bias","research-methods/newey-west","research-methods/multiple-testing","research-methods/walk-forward"],"in":[],"ghostOut":[],"degree":5,"orphan":false},{"id":"research-methods/information-coefficient","path":"research-methods/information-coefficient.md","folder":"research-methods","base":"information-coefficient","title":"Information coefficient","isIndex":false,"topic":"research-methods","tags":["sample","signals","statistics"],"aliases":["IC","rank IC"],"type":"concept","status":"evergreen","description":"","created":"2026-09-03","updated":"2026-10-30","words":129,"body":"# Information coefficient\n\nThe **information coefficient (IC)** is the cross-sectional correlation between a signal today and returns over the next period. Most desks use the *rank* IC (Spearman), which is robust to outliers.\n\n> An IC of 0.03 sounds tiny, but applied across 500 stocks every day it can be a very good strategy.\n\n## Why it matters\n- It isolates *predictive power* from portfolio construction choices.\n- The IC decays with horizon; plotting the decay tells you how fast to trade.\n- The *fundamental law of active management*: IR ≈ IC × √breadth. See [[Fundamental law of active management]].\n\n## Pitfalls\nDaily ICs on overlapping 5-day returns are autocorrelated, so the naive t-stat is too high — use [[Newey-West standard errors]]. And make sure the signal only uses information available at the time ([[Look-ahead bias]]).\n\n```python\nic = signal.rank(axis=1).corrwith(fwd_ret.rank(axis=1), axis=1)\n```\n","out":["research-methods/newey-west","research-methods/look-ahead-bias"],"in":["research-methods/_index","research-methods/look-ahead-bias","research-methods/newey-west"],"ghostOut":["ghost:fundamental-law-of-active-management"],"degree":4,"orphan":false},{"id":"research-methods/look-ahead-bias","path":"research-methods/look-ahead-bias.md","folder":"research-methods","base":"look-ahead-bias","title":"Look-ahead bias","isIndex":false,"topic":"research-methods","tags":["sample","pitfalls","backtesting"],"aliases":[],"type":"concept","status":"evergreen","description":"","created":"2026-09-04","updated":"2026-10-12","words":82,"body":"# Look-ahead bias\n\nUsing information in a backtest that would not have been available at the time of the trade.\n\nClassic sources:\n1. Using the **close** price to compute a signal and also trade at that close.\n2. Index membership taken from *today's* list → survivorship bias.\n3. Restated fundamentals instead of point-in-time data.\n\nThe fix is explicit execution timing: signal at *t*, trade at the open of *t+1*. [[Walk-forward validation]] won't save you if the data itself leaks the future.\n\nRelated: [[Information coefficient]], [[Survivorship bias]].\n","out":["research-methods/walk-forward","research-methods/information-coefficient"],"in":["research-methods/_index","research-methods/information-coefficient","research-methods/walk-forward"],"ghostOut":["ghost:survivorship-bias"],"degree":4,"orphan":false},{"id":"research-methods/multiple-testing","path":"research-methods/multiple-testing.md","folder":"research-methods","base":"multiple-testing","title":"Multiple testing","isIndex":false,"topic":"research-methods","tags":["sample","statistics","pitfalls"],"aliases":[],"type":"concept","status":"seed","description":"","created":"2026-10-20","updated":"2026-10-21","words":28,"body":"# Multiple testing\n\nIf you test 20 independent useless signals at 5%, you expect one false positive.\n\nCorrections to write up: Bonferroni, Holm, Benjamini–Hochberg, and the [[Deflated Sharpe ratio]].\n","out":[],"in":["research-methods/_index","research-methods/walk-forward"],"ghostOut":["ghost:deflated-sharpe-ratio"],"degree":3,"orphan":false},{"id":"research-methods/newey-west","path":"research-methods/newey-west.md","folder":"research-methods","base":"newey-west","title":"Newey-West standard errors","isIndex":false,"topic":"research-methods","tags":["sample","statistics"],"aliases":[],"type":"concept","status":"budding","description":"","created":"2026-09-10","updated":"2026-10-05","words":55,"body":"# Newey-West standard errors\n\nA heteroskedasticity- and autocorrelation-consistent (HAC) estimator of the standard error of a mean. Use it when your observations overlap — e.g. daily [[Information coefficient]] values on 5-day forward returns.\n\nRule of thumb for the lag: at least the overlap length (h − 1), often `floor(4 (T/100)^(2/9))`.\n\nTODO: compare with a block bootstrap.\n","out":["research-methods/information-coefficient"],"in":["research-methods/_index","research-methods/information-coefficient"],"ghostOut":[],"degree":2,"orphan":false},{"id":"research-methods/walk-forward","path":"research-methods/walk-forward.md","folder":"research-methods","base":"walk-forward","title":"Walk-forward validation","isIndex":false,"topic":"research-methods","tags":["sample","backtesting"],"aliases":[],"type":"method","status":"budding","description":"","created":"2026-09-15","updated":"2026-10-25","words":58,"body":"# Walk-forward validation\n\nFit on a rolling (or expanding) window, then evaluate on the following, unseen window. Repeat. Concatenate only the out-of-sample segments.\n\n- Add a **purge gap** between train and test equal to the label horizon.\n- Keep the parameter-selection procedure itself inside the loop.\n\nGuards against overfitting but not against [[Look-ahead bias]] or [[Multiple testing]] across many walk-forward runs.\n","out":["research-methods/look-ahead-bias","research-methods/multiple-testing"],"in":["research-methods/_index","research-methods/look-ahead-bias"],"ghostOut":[],"degree":3,"orphan":false},{"id":"trading-desk/_index","path":"trading-desk/_index.md","folder":"trading-desk","base":"_index","title":"Trading Desk","isIndex":true,"topic":"trading-desk","tags":["sample","moc"],"aliases":[],"type":"index","status":"budding","description":"","created":"2026-09-12","updated":"2026-10-26","words":28,"body":"# Trading Desk\n\nHow a dealer actually makes money and manages risk — the mechanics behind Atlas Markets and Prime Desk.\n\n- [[Market making]]\n- [[Bid-ask spread]]\n- [[Inventory risk]]\n- [[RFQ workflow]]\n","out":["trading-desk/market-making","trading-desk/bid-ask-spread","trading-desk/inventory-risk","trading-desk/rfq-workflow"],"in":[],"ghostOut":[],"degree":4,"orphan":false},{"id":"trading-desk/bid-ask-spread","path":"trading-desk/bid-ask-spread.md","folder":"trading-desk","base":"bid-ask-spread","title":"Bid-ask spread","isIndex":false,"topic":"trading-desk","tags":["sample","microstructure","costs"],"aliases":[],"type":"concept","status":"budding","description":"","created":"2026-09-13","updated":"2026-10-08","words":40,"body":"# Bid-ask spread\n\nThe difference between the best offer and the best bid. For a taker it's a cost; for a [[Market making|market maker]] it's revenue.\n\nSpread compensates for order-processing cost, [[Inventory risk]], and [[Adverse selection]]. Wider in volatile and illiquid names.\n","out":["trading-desk/market-making","trading-desk/inventory-risk"],"in":["options/gamma-scalping","trading-desk/_index","trading-desk/market-making"],"ghostOut":["ghost:adverse-selection"],"degree":5,"orphan":false},{"id":"trading-desk/inventory-risk","path":"trading-desk/inventory-risk.md","folder":"trading-desk","base":"inventory-risk","title":"Inventory risk","isIndex":false,"topic":"trading-desk","tags":["sample","risk"],"aliases":[],"type":"concept","status":"budding","description":"","created":"2026-09-14","updated":"2026-10-19","words":46,"body":"# Inventory risk\n\nThe risk a dealer carries between buying from one client and selling to another. Measured in the book's [[The Greeks|Greeks]] for options, or in DV01 / beta-adjusted notional for linear products.\n\nManaged by skewing quotes ([[Market making]]), hedging in the street, or internalising offsetting flow.\n","out":["options/the-greeks","trading-desk/market-making"],"in":["options/the-greeks","trading-desk/_index","trading-desk/bid-ask-spread","trading-desk/market-making"],"ghostOut":[],"degree":4,"orphan":false},{"id":"trading-desk/market-making","path":"trading-desk/market-making.md","folder":"trading-desk","base":"market-making","title":"Market making","isIndex":false,"topic":"trading-desk","tags":["sample","microstructure"],"aliases":[],"type":"concept","status":"evergreen","description":"","created":"2026-09-12","updated":"2026-10-14","words":62,"body":"# Market making\n\nA market maker continuously quotes a bid and an offer, earning the [[Bid-ask spread]] in exchange for taking on [[Inventory risk]].\n\nTwo enemies:\n- **Inventory** — getting stuck long into a falling market.\n- **[[Adverse selection]]** — trading with someone who knows more than you.\n\nGood quoting *skews* prices: when long, lower both bid and ask to attract buyers and shed inventory.\n","out":["trading-desk/bid-ask-spread","trading-desk/inventory-risk"],"in":["trading-desk/_index","trading-desk/bid-ask-spread","trading-desk/inventory-risk","trading-desk/rfq-workflow"],"ghostOut":["ghost:adverse-selection"],"degree":5,"orphan":false},{"id":"trading-desk/rfq-workflow","path":"trading-desk/rfq-workflow.md","folder":"trading-desk","base":"rfq-workflow","title":"RFQ workflow","isIndex":false,"topic":"trading-desk","tags":["sample","process"],"aliases":[],"type":"process","status":"seed","description":"","created":"2026-10-24","updated":"2026-10-24","words":35,"body":"# RFQ workflow\n\nClient requests a quote → dealer prices (mid + spread + skew) → client hits/lifts or passes.\n\nTo expand: last look, hit ratios, and how [[Market making]] differs in RFQ vs lit markets.\n","out":["trading-desk/market-making"],"in":["trading-desk/_index"],"ghostOut":[],"degree":2,"orphan":false},{"id":"trading-desk/trade-journal-template","path":"trading-desk/trade-journal-template.md","folder":"trading-desk","base":"trade-journal-template","title":"Trade journal template","isIndex":false,"topic":"trading-desk","tags":["sample","template"],"aliases":[],"type":"template","status":"seed","description":"","created":"2026-10-30","updated":"2026-10-30","words":18,"body":"# Trade journal template\n\n- **Date / instrument:**\n- **Thesis:**\n- **Entry, size, stop:**\n- **What would prove me wrong:**\n- **Outcome & lesson:**\n","out":[],"in":[],"ghostOut":[],"degree":0,"orphan":true}],"ghosts":[{"id":"ghost:other-minds","title":"Other minds","ghost":true,"refs":["philosophy/_index","philosophy/01-existence-and-uncertainty","philosophy/07-human-existence"],"degree":3},{"id":"ghost:adverse-selection","title":"Adverse selection","ghost":true,"refs":["trading-desk/bid-ask-spread","trading-desk/market-making"],"degree":2},{"id":"ghost:ethics-and-other-people","title":"Ethics and other people","ghost":true,"refs":["philosophy/_index","philosophy/09-practical-philosophy"],"degree":2},{"id":"ghost:heston-model","title":"Heston model","ghost":true,"refs":["options/black-scholes","options/volatility-smile"],"degree":2},{"id":"ghost:problem-of-induction","title":"Problem of induction","ghost":true,"refs":["philosophy/_index","philosophy/05-prediction-and-reliability"],"degree":2},{"id":"ghost:source-of-normativity","title":"Source of normativity","ghost":true,"refs":["philosophy/_index","philosophy/09-practical-philosophy"],"degree":2},{"id":"ghost:deflated-sharpe-ratio","title":"Deflated Sharpe ratio","ghost":true,"refs":["research-methods/multiple-testing"],"degree":1},{"id":"ghost:fundamental-law-of-active-management","title":"Fundamental law of active management","ghost":true,"refs":["research-methods/information-coefficient"],"deg     D.notes.forEach(n => counts.set(n.topic, (counts.get(n.topic) || 0) + 1));
    const sw = (cls, extra) => `<svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="6" ${extra}/></svg>`;
    const fg = darkMq.matches ? '#bbb' : '#666';
    $('#legend-body').innerHTML =
      D.topics.map(t => `<div class="lg-row${S.f.topic && S.f.topic !== t.id ? ' off' : ''}" data-topic="${esc(t.id)}"><span class="dot" style="--c:${color({ topic: t.id })};margin:0"></span>${esc(t.name)}<span class="n">${counts.get(t.id) || 0}</span></div>`).join('') +
      '<hr>' +
      `<div class="lg-row" style="cursor:default">${sw('', `fill="${fg}" fill-opacity=".28" stroke="${fg}" stroke-dasharray="3 2" stroke-width="1.5"`)} Seed — faded, dashed</div>` +
      `<div class="lg-row" style="cursor:default">${sw('', `fill="${fg}"`)} Budding</div>` +
      `<div class="lg-row" style="cursor:default">${sw('', `fill="${fg}" filter="url(#glow)" stroke="${fg}" stroke-opacity=".5" stroke-width="2"`)} Evergreen — glowing</div>` +
      `<div class="lg-row" style="cursor:default"><svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="4" fill="${fg}"/><circle r="7.5" fill="none" stroke="var(--orphan)" stroke-dasharray="1.5 3" stroke-width="1.5"/></svg> Orphan — no links</div>` +
      `<div class="lg-row" style="cursor:default"><svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="5" fill="none" stroke="var(--ghost)" stroke-dasharray="2 2" stroke-width="1.4"/></svg> Ghost — not written yet</div>` +
      '<div class="muted" style="padding:4px;font-size:11.5px">Size = number of links</div>';
  }

  /* ---------- panel ---------- */
  const panelOpen = () => $('#panel').classList.contains('open');
  function showPanel() {
    $('#panel').classList.add('open');
    $('#panel').setAttribute('aria-hidden', 'false');
    $('#main').classList.add('panel-open');
  }
  function closePanel() {
    $('#panel').classList.remove('open', 'expanded');
    $('#panel').setAttribute('aria-hidden', 'true');
    $('#main').classList.remove('panel-open');
    S.selected = null; S.history = [];
    setHash('');
    if (S.mode === 'local') renderGraph(); else updateClasses();
  }
  function setHash(id) {
    try { history.replaceState(null, '', id ? '#note=' + encodeURIComponent(id) : location.pathname + location.search); } catch (e) { /* file:// in some browsers */ }
  }

  function openNote(id, opts) {
    opts = opts || {};
    if (!byId.has(id)) return;
    if (S.selected && S.selected !== id && !opts.back) S.history.push(S.selected);
    S.selected = id;
    const wasOpen = panelOpen();
    renderPanel();
    showPanel();
    setHash(id);
    $('#panel-body').scrollTop = 0;
    if (S.mode === 'local') renderGraph();
    else {
      updateClasses();
      if ((opts.from !== 'graph' || phoneMq.matches) && S.view === 'graph') setTimeout(() => centerOn(id), wasOpen ? 0 : 280);
    }
  }

  function contextLine(src, targetId) {
    for (const line of src.body.split('\n')) {
      if (!line.includes('[[')) continue;
      let hit = false;
      const out = line.replace(core.WIKI, (m, inner) => {
        const L = core.parseLink(inner);
        const id = core.resolve(D.index, L.target) || core.ghostId(L.target);
        const label = esc(L.alias || L.target);
        if (id === targetId) { hit = true; return '\u0001' + label + '\u0002'; }
        return label;
      });
      if (hit) {
        const p = esc(core.plain(out.replace(/[\u0001\u0002]/g, m => (m === '\u0001' ? '@@B@@' : '@@/B@@'))));
        return p.replace(/@@B@@/g, '<b>').replace(/@@\/B@@/g, '</b>');
      }
    }
    return '';
  }

  function mdToHtml(n) {
    let body = n.body;
    const h1 = body.match(/^\s*#\s+(.+?)\s*\n/);
    if (h1 && core.normKey(h1[1]) === core.normKey(n.title)) body = body.slice(h1[0].length);
    body = core.mapOutsideCode(body, seg => seg.replace(core.WIKI, (m, inner) => {
      const L = core.parseLink(inner);
      if (!L.target) return m;
      const id = core.resolve(D.index, L.target);
      const label = esc(L.alias || (L.heading ? L.target + ' › ' + L.heading : L.target));
      return id
        ? `<a href="#" class="wikilink" data-id="${esc(id)}">${label}</a>`
        : `<a href="#" class="wikilink ghost" data-id="${esc(core.ghostId(L.target))}" title="Not written yet">${label}</a>`;
    }));
    let html = window.marked ? marked.parse(body, { gfm: true }) : '<pre style="white-space:pre-wrap">' + esc(body) + '</pre>';
    if (window.DOMPurify) html = DOMPurify.sanitize(html);
    return html;
  }

  function linkList(ids, targetId) {
    return ids.map(id => byId.get(id)).filter(Boolean).sort((a, b) => a.title.localeCompare(b.title)).map(s => {
      const ctx = targetId ? contextLine(s, targetId) : '';
      return `<button class="bl" data-id="${esc(s.id)}"><div class="t">${dotHtml(s)}${esc(s.title)}</div>${ctx ? `<div class="s">${ctx}</div>` : ''}</button>`;
    }).join('');
  }

  function renderPanel() {
    const n = byId.get(S.selected);
    if (!n) return;
    $('#p-back').disabled = !S.history.length;
    $('#p-local').hidden = S.mode === 'local';
    $('#p-expand').hidden = !phoneMq.matches;
    let h;
    if (n.ghost) {
      const tc = {};
      n.refs.forEach(r => { const t = byId.get(r).topic; tc[t] = (tc[t] || 0) + 1; });
      const topic = Object.entries(tc).sort((a, b) => b[1] - a[1])[0];
      const file = (topic && topic[0] ? topic[0] + '/' : '') + n.title.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') + '.md';
      h = `<div class="crumbs"><span class="chip ghost-chip">✎ Not written yet</span></div>
        <h1 class="note-title">${esc(n.title)}</h1>
        <p class="muted" style="font-family:var(--read);font-size:16px">This note doesn't exist yet. ${n.refs.length} note${n.refs.length === 1 ? ' links' : 's link'} to it, so it's on your to-write list.</p>
        <p class="muted">Suggested file: <code style="font-family:var(--mono)">${esc(file)}</code></p>
        <section class="links-sec"><h3>Wanted by (${n.refs.length})</h3>${linkList(n.refs, n.id)}</section>`;
    } else {
      const meta = [n.created && `Created ${fmtDate(n.created)}`, n.updated && `Updated ${fmtDate(n.updated)}`, `${n.words} words`, n.type && n.type].filter(Boolean);
      h = `<div class="crumbs">${topicChip(n)}${statusChip(n)}${n.orphan ? '<span class="chip orph">○ orphan</span>' : ''}</div>
        <h1 class="note-title">${esc(n.title)}</h1>
        <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>
        ${n.tags.length ? `<div class="tags">${n.tags.map(t => `<button class="chip" data-tag="${esc(t)}" title="Filter by tag">${esc(t)}</button>`).join('')}</div>` : ''}
        <article class="prose">${mdToHtml(n)}</article>
        <section class="links-sec"><h3>Linked from (${n.in.length})</h3>${n.in.length ? linkList(n.in, n.id) : '<p class="muted">No backlinks yet.</p>'}</section>
        ${n.out.length ? `<section class="links-sec"><h3>Links to (${n.out.length})</h3>${linkList(n.out)}</section>` : ''}
        ${n.ghostOut.length ? `<section class="links-sec"><h3>Not written yet (${n.ghostOut.length})</h3><div class="chips">${n.ghostOut.map(g => `<button class="chip ghost-chip" data-id="${esc(g)}">${esc(byId.get(g).title)}</button>`).join('')}</div></section>` : ''}
        <p class="muted" style="margin-top:28px;font-size:12px;font-family:var(--mono)">${esc(n.path)}</p>`;
    }
    $('#panel-body').innerHTML = h;
  }

  /* ---------- list views ---------- */
  function statusBar(sc) {
    const total = Object.values(sc).reduce((a, b) => a + b, 0) || 1;
    const col = { seed: 'var(--seed)', budding: 'var(--budding)', evergreen: 'var(--evergreen)' };
    return `<div class="bar" title="${esc(Object.entries(sc).map(([k, v]) => `${v} ${k}`).join(', '))}">` +
      ['seed', 'budding', 'evergreen', ...Object.keys(sc).filter(k => !col[k])].filter(k => sc[k]).map(k => `<span style="width:${(sc[k] / total) * 100}%;background:${col[k] || 'var(--faint)'}"></span>`).join('') + '</div>';
  }
  function renderTopics() {
    const cards = D.topics.map(t => {
      const c = color({ topic: t.id });
      const sc = t.statusCounts;
      return `<div class="card" role="button" tabindex="0" data-open-topic="${esc(t.id)}" style="--c:${c}">
        <div class="row"><div class="count">${t.count} <small>note${t.count === 1 ? '' : 's'}</small></div></div>
        <h3>${esc(t.name)}</h3>
        <div class="desc">${esc(t.description || (t.indexId ? '' : 'No _index.md in this folder yet.'))}</div>
        ${statusBar(sc)}
        <div class="row"><span class="muted" style="font-size:12px">${['seed', 'budding', 'evergreen'].filter(s => sc[s]).map(s => `${STATUS_ICON[s]} ${sc[s]}`).join('  ')}</span>
        <div class="acts"><button class="btn" data-graph-topic="${esc(t.id)}" style="height:28px;font-size:12px">Show in graph</button></div></div>
      </div>`;
    }).join('');
    $('#view-topics').innerHTML = `<h2 class="vh">Topics</h2><p class="vsub">One card per topic folder, from its <code>_index.md</code>.</p><div class="cards">${cards || '<div class="empty">No topics yet.</div>'}</div>`;
  }
  function noteRow(n, date) {
    const t = topicOf(n.topic);
    return `<button class="nrow" data-id="${esc(n.id)}"><span class="d">${esc(date || '')}</span>
      <span style="min-width:0"><span class="tt">${dotHtml(n)}${esc(n.title)}</span><div class="sn">${esc(core.plain(n.body).slice(0, 160))}</div></span>
      <span class="r">${t ? `<span class="chip topic" style="--c:${color(n)}">${esc(t.name)}</span>` : ''}${statusChip(n)}</span></button>`;
  }
  function filterNote() {
    const bits = [S.f.topic && topicOf(S.f.topic).name, S.f.tag && '#' + S.f.tag, S.f.status].filter(Boolean);
    return bits.length ? ` Filtered by ${bits.map(esc).join(', ')}.` : '';
  }
  function renderRecent() {
    const list = D.notes.filter(passes).slice().sort((a, b) => (b.updated || '').localeCompare(a.updated || '') || a.title.localeCompare(b.title));
    let html = '', month = '';
    for (const n of list) {
      const m = n.updated ? new Date(n.updated + 'T12:00:00').toLocaleDateString([], { year: 'numeric', month: 'long' }) : 'Undated';
      if (m !== month) { html += `<div class="month">${esc(m)}</div>`; month = m; }
      html += noteRow(n, n.updated);
    }
    $('#view-recent').innerHTML = `<h2 class="vh">Recent</h2><p class="vsub">Notes by last updated date.${filterNote()}</p><div class="rows">${html || '<div class="empty">No notes match the filters.</div>'}</div>`;
  }
  function renderGarden() {
    const vis = D.notes.filter(passes);
    const seeds = vis.filter(n => n.status === 'seed').sort((a, b) => (a.updated || '').localeCompare(b.updated || ''));
    const orphans = vis.filter(n => n.orphan);
    const visIds = new Set(vis.map(n => n.id));
    const ghosts = D.ghosts.filter(g => g.refs.some(r => visIds.has(r)));
    const item = (n, sub) => `<button class="gitem" data-id="${esc(n.id)}"><div class="t">${dotHtml(n)}${esc(n.title)}</div><div class="s">${sub}</div></button>`;
    const col = (title, icon, desc, items) => `<div class="gcol"><h3>${icon} ${title}<span class="n">${items.length}</span></h3><p>${desc}</p>${items.join('') || '<div class="empty">Nothing here — nice.</div>'}</div>`;
    $('#view-garden').innerHTML = `<h2 class="vh">Garden</h2><p class="vsub">What to tend next.${filterNote()}</p><div class="garden">
      ${col('Ghost links', '✎', 'Linked but not written yet — your to-write list, most-wanted first.', ghosts.map(g => item(g, `wanted by ${g.refs.map(r => esc(byId.get(r).title)).join(', ')}`)))}
      ${col('Seeds', '🌱', 'Rough notes to grow, oldest first.', seeds.map(n => item(n, `${esc(topicOf(n.topic) ? topicOf(n.topic).name : '')} · updated ${esc(fmtDate(n.updated))}`)))}
      ${col('Orphans', '○', 'No links in or out. Connect them to something.', orphans.map(n => item(n, `${esc(topicOf(n.topic) ? topicOf(n.topic).name : '')} · ${n.words} words`)))}
    </div>`;
  }

  function setView(v) {
    S.view = v;
    $$('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    ['graph', 'topics', 'recent', 'garden'].forEach(x => { $('#view-' + x).hidden = x !== v; });
  }
  function setFilter(k, v) {
    S.f[k] = v;
    $('#f-' + k).value = v;
    renderGraph(); renderLegend(); renderRecent(); renderGarden();
  }

  /* ---------- search ---------- */
  let resIdx = -1;
  function search(q) {
    q = q.trim().toLowerCase();
    if (q.length < 1) return [];
    const words = q.split(/\s+/);
    const out = [];
    for (const e of searchIdx) {
      let score = 0, pos = -1;
      for (const w of words) {
        let s = 0;
        if (e.t.startsWith(w)) s += 6; else if (e.t.includes(w)) s += 4;
        if (e.extra.includes(w)) s += 2;
        const p = e.plain.toLowerCase().indexOf(w);
        if (p >= 0) { s += 1; if (pos < 0) pos = p; }
        if (!s) { score = 0; break; }
        score += s;
      }
      if (score) out.push({ e, score, pos });
    }
    return out.sort((a, b) => b.score - a.score || a.e.n.title.localeCompare(b.e.n.title)).slice(0, 30);
  }
  function hl(text, q) {
    let h = esc(text);
    q.trim().split(/\s+/).filter(Boolean).forEach(w => {
      h = h.replace(new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
    });
    return h;
  }
  function renderResults() {
    const q = $('#q').value;
    const box = $('#results');
    if (!q.trim()) { box.hidden = true; S.qMatch = null; updateClasses(); return; }
    const res = search(q);
    S.qMatch = new Set(res.map(r => r.e.n.id));
    updateClasses();
    resIdx = res.length ? 0 : -1;
    box.innerHTML = res.length ? res.slice(0, 12).map((r, i) => {
      const n = r.e.n;
      let snip = n.ghost ? 'Not written yet' : '';
      if (!n.ghost) {
        const p = r.pos >= 0 ? r.pos : 0;
        snip = (p > 40 ? '…' : '') + r.e.plain.slice(Math.max(0, p - 40), p + 120);
      }
      return `<div class="res${i === 0 ? ' active' : ''}" data-id="${esc(n.id)}" role="option">${dotHtml(n)}<div><div class="rt">${hl(n.title, q)}</div><div class="rs">${hl(snip, q)}</div></div></div>`;
    }).join('') : '<div class="res-empty">No matches.</div>';
    box.hidden = false;
  }
  function pickResult(id) {
    $('#results').hidden = true;
    $('#q').blur();
    openNote(id, { from: 'search' });
  }

  /* ---------- open folder ---------- */
  async function loadFolder(fileList) {
    const files = [...fileList].filter(f => /\.md$/i.test(f.name));
    if (!files.length) { toast('No .md files found in that folder.'); return; }
    const root = (files[0].webkitRelativePath || '').split('/')[0];
    const items = await Promise.all(files.map(async f => {
      const parts = (f.webkitRelativePath || f.name).split('/');
      if (root && parts[0] === root) parts.shift();
      return { path: parts.join('/'), content: await f.text(), mtime: f.lastModified };
    }));
    const clean = items.filter(it => !it.path.split('/').some(s => s.startsWith('.') || s === 'node_modules'));
    const data = core.build(clean, { source: root ? root + '/' : 'selected files', origin: 'browser' });
    cache.clear(); firstLayout = true;
    S.history = [];
    if (panelOpen()) closePanel();
    load(data);
    toast(`Loaded ${data.notes.length} notes from ${root || 'selection'}.`);
  }
  let toastT;
  function toast(msg) {
    let t = $('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }

  /* ---------- events ---------- */
  function wire() {
    $$('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
    $('#f-topic').addEventListener('change', e => setFilter('topic', e.target.value));
    $('#f-tag').addEventListener('change', e => setFilter('tag', e.target.value));
    $('#f-status').addEventListener('change', e => setFilter('status', e.target.value));
    $$('#mode-seg button').forEach(b => b.addEventListener('click', () => { S.mode = b.dataset.mode; if (panelOpen()) renderPanel(); renderGraph(); }));
    $$('#hops-seg button').forEach(b => b.addEventListener('click', () => { S.hops = +b.dataset.hops; renderGraph(); }));
    $('#show-ghosts').addEventListener('change', e => { S.ghosts = e.target.checked; renderGraph(); });
    $('#fit').addEventListener('click', () => fit(true));
    $('#legend-body').addEventListener('click', e => {
      const r = e.target.closest('[data-topic]');
      if (r) setFilter('topic', S.f.topic === r.dataset.topic ? '' : r.dataset.topic);
    });

    // Anything with data-id opens that note; data-topic/data-tag set filters.
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-id],[data-topic],[data-tag],[data-graph-topic],[data-open-topic]');
      if (!el || el.closest('#legend-body') || el.closest('#results')) return;
      if (el.dataset.graphTopic != null) { e.stopPropagation(); setFilter('topic', el.dataset.graphTopic); setView('graph'); return; }
      if (el.dataset.openTopic != null) {
        const t = topicOf(el.dataset.openTopic);
        if (t && t.indexId) openNote(t.indexId, { from: 'list' }); else { setFilter('topic', el.dataset.openTopic); setView('recent'); }
        return;
      }
      e.preventDefault();
      if (el.dataset.id) openNote(el.dataset.id, { from: 'link' });
      else if (el.dataset.topic != null) setFilter('topic', el.dataset.topic);
      else if (el.dataset.tag != null) setFilter('tag', el.dataset.tag);
    });
    $('#view-topics').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.openTopic != null) e.target.click(); });
    // Relative Markdown links to other notes: [text](other-note.md)
    $('#panel-body').addEventListener('click', e => {
      const a = e.target.closest('.prose a[href]');
      if (!a || a.classList.contains('wikilink')) return;
      const href = decodeURIComponent(a.getAttribute('href') || '');
      if (/^[a-z]+:/i.test(href) || href.startsWith('#')) { if (/^https?:/i.test(href)) a.target = '_blank'; return; }
      const id = core.resolve(D.index, href.replace(/#.*$/, '').replace(/^\.?\//, ''));
      if (id) { e.preventDefault(); openNote(id, { from: 'link' }); }
    });

    $('#p-close').addEventListener('click', closePanel);
    $('#p-back').addEventListener('click', () => { const id = S.history.pop(); if (id) openNote(id, { back: true, from: 'link' }); });
    $('#p-local').addEventListener('click', () => { S.mode = 'local'; setView('graph'); renderPanel(); renderGraph(); });
    $('#p-expand').addEventListener('click', () => $('#panel').classList.toggle('expanded'));

    // Bottom-sheet drag (phone)
    const panel = $('#panel'), grip = $('#grip');
    let y0 = null, dy = 0;
    grip.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; panel.style.transition = 'none'; grip.setPointerCapture(e.pointerId); });
    grip.addEventListener('pointermove', e => { if (y0 == null) return; dy = e.clientY - y0; panel.style.transform = `translateY(${Math.max(0, dy)}px)`; });
    const end = () => {
      if (y0 == null) return;
      panel.style.transition = ''; panel.style.transform = '';
      if (dy > 90) { if (panel.classList.contains('expanded')) panel.classList.remove('expanded'); else closePanel(); }
      else if (dy < -30) panel.classList.add('expanded');
      else if (Math.abs(dy) < 4) panel.classList.toggle('expanded');
      y0 = null;
    };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);

    const q = $('#q');
    q.addEventListener('input', renderResults);
    q.addEventListener('focus', () => { if (q.value.trim()) renderResults(); });
    q.addEventListener('keydown', e => {
      const items = $$('#results .res');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!items.length) return;
        resIdx = (resIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
        items.forEach((x, i) => x.classList.toggle('active', i === resIdx));
        items[resIdx].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter' && items[resIdx]) { e.preventDefault(); pickResult(items[resIdx].dataset.id); }
    });
    $('#results').addEventListener('mousedown', e => { const r = e.target.closest('.res'); if (r) { e.preventDefault(); pickResult(r.dataset.id); } });
    document.addEventListener('click', e => { if (!e.target.closest('.search')) $('#results').hidden = true; });

    document.addEventListener('keydown', e => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if (e.key === '/' && !typing) { e.preventDefault(); q.focus(); q.select(); }
      else if (e.key === 'Escape') {
        if (document.activeElement === q) {
          if (!$('#results').hidden) $('#results').hidden = true;
          else { q.value = ''; renderResults(); q.blur(); }
        } else if (panelOpen()) closePanel();
      }
    });

    $('#open-folder').addEventListener('click', () => $('#folder-input').click());
    $('#folder-input').addEventListener('change', e => { loadFolder(e.target.files).catch(err => toast('Could not read folder: ' + err.message)); e.target.value = ''; });

    const recolor = () => { renderGraph(); renderLegend(); renderTopics(); renderRecent(); renderGarden(); if (S.selected) renderPanel(); };
    (darkMq.addEventListener ? darkMq.addEventListener('change', recolor) : darkMq.addListener(recolor));
    window.addEventListener('hashchange', () => {
      const m = location.hash.match(/^#note=(.+)$/);
      if (m && decodeURIComponent(m[1]) !== S.selected) openNote(decodeURIComponent(m[1]), { from: 'link' });
    });
  }

  /* ---------- boot ---------- */
  wire();
  if (!phoneMq.matches) $('#legend').open = true;
  initGraph();
  load(JSON.parse(document.getElementById('kb-data').textContent));
  const m = location.hash.match(/^#note=(.+)$/);
  if (m && byId.has(decodeURIComponent(m[1]))) openNote(decodeURIComponent(m[1]), { from: 'link' });
  window.KB = { get data() { return D; }, openNote, state: S };
})();</script>
</body>
</html>
